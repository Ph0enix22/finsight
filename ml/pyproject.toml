[project]
name = "finsight-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "S.M.J", email = "185355773+Ph0enix22@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=2,<3",
    "pdfplumber>=0.11.10",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
